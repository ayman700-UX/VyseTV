# Builds VyseTV on every platform.
#
# Flutter stays pinned to 3.47.1: Windows needs the patched engine
# (flutter-plezy windows-v3.47.1+2), which only matches that SDK.
# libmpv comes from the mpv-build releases, pinned in mpv-build.lock.json
# (Android/Windows/Linux) and the Xcode projects (MPVKit for iOS/macOS).

name: Build

# What gets built:
#
#   * Run by hand ("Run workflow" in the Actions tab): the platform you pick.
#   * A push to main: the platforms named in the commit message, in square
#     brackets: [linux] [linux-x64] [linux-arm64] [macos] [ios] [android]
#     [windows] or [all]. A push that names none builds nothing.
#   * [webos] builds the LG TV package. It is asked for by its own name only, never by
#     [all]: see the webos job at the end.
#   * [tvos] builds the Apple TV package, likewise by its own name only (the tvos job).
#     [tvos-torrent] builds the torrent engine for it (the tvos-torrent job), which is then
#     committed to packages/torrserver_flutter/binaries.
#   * [tizen] builds the Samsung TV packages, likewise by its own name only (the tizen job).
#
# On a private repository the macOS and iOS jobs use up build minutes ten times
# faster than the Linux ones, and Windows twice as fast.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: What to build
        type: choice
        default: linux
        options: [all, linux, linux-x64, linux-arm64, macos, ios, android, windows, webos, tvos, tvos-torrent, tizen]
  push:
    branches: [main]

env:
  FLUTTER_VERSION: 3.47.1

jobs:
  # Reads what to build from the "Run workflow" choice or the commit message.
  plan:
    name: Choose what to build
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      macos: ${{ steps.pick.outputs.macos }}
      ios: ${{ steps.pick.outputs.ios }}
      android: ${{ steps.pick.outputs.android }}
      windows: ${{ steps.pick.outputs.windows }}
      webos: ${{ steps.pick.outputs.webos }}
      tvos: ${{ steps.pick.outputs.tvos }}
      tvos_torrent: ${{ steps.pick.outputs.tvos_torrent }}
      tizen: ${{ steps.pick.outputs.tizen }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          PLATFORM: ${{ inputs.platform }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            pick="$PLATFORM"
          else
            pick=$(printf '%s' "$MESSAGE" | grep -oE '\[(all|linux|linux-x64|linux-arm64|macos|ios|android|windows|webos|tvos|tvos-torrent|tizen)\]' | tr -d '[]' | tr '\n' ' ' || true)
          fi
          echo "Building: ${pick:-nothing}"
          has() { case " $pick " in *" all "*|*" $1 "*) return 0 ;; esac; return 1; }
          # Flutter's stable channel has no ARM64 Linux download; the same version
          # is taken from its source instead (channel master), as upstream does.
          x64='{"arch":"x64","runner":"ubuntu-24.04","channel":"stable","triplet":"x86_64-linux-gnu","appimage":"x86_64"}'
          arm64='{"arch":"arm64","runner":"ubuntu-24.04-arm","channel":"master","triplet":"aarch64-linux-gnu","appimage":"aarch64"}'
          list=""
          if has linux || has linux-x64; then list="$x64"; fi
          if has linux || has linux-arm64; then list="${list:+$list,}$arm64"; fi
          echo "linux=[$list]" >> "$GITHUB_OUTPUT"
          for p in macos ios android windows; do
            if has "$p"; then echo "$p=true" >> "$GITHUB_OUTPUT"; else echo "$p=false" >> "$GITHUB_OUTPUT"; fi
          done
          # (the LG TV build: by its own name only, "all" does not ask for it)
          case " $pick " in *" webos "*) echo "webos=true" >> "$GITHUB_OUTPUT" ;; *) echo "webos=false" >> "$GITHUB_OUTPUT" ;; esac
          # (the Apple TV build: likewise by its own name only)
          case " $pick " in *" tvos "*) echo "tvos=true" >> "$GITHUB_OUTPUT" ;; *) echo "tvos=false" >> "$GITHUB_OUTPUT" ;; esac
          case " $pick " in *" tvos-torrent "*) echo "tvos_torrent=true" >> "$GITHUB_OUTPUT" ;; *) echo "tvos_torrent=false" >> "$GITHUB_OUTPUT" ;; esac
          # (the Samsung TV build: likewise by its own name only)
          case " $pick " in *" tizen "*) echo "tizen=true" >> "$GITHUB_OUTPUT" ;; *) echo "tizen=false" >> "$GITHUB_OUTPUT" ;; esac

  # 64-bit Intel/AMD and 64-bit ARM. Flutter has no 32-bit Linux desktop build.
  linux:
    name: Linux (${{ matrix.arch }})
    needs: plan
    if: ${{ needs.plan.outputs.linux != '[]' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4

      # The -dev packages build the app; the runtime libraries they pull in are
      # what bundle-libs.sh copies next to libmpv (it links libass, pipewire, ...).
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config zstd libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libepoxy-dev libegl-dev libgl-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libass-dev libfreetype-dev libfontconfig-dev libfribidi-dev libharfbuzz-dev \
            libgnutls28-dev libpipewire-0.3-dev libva-dev libvdpau-dev libx11-dev libxext-dev libxrandr-dev \
            libxss-dev libxpresent-dev libpulse-dev libdbus-1-dev libdrm-dev libgbm-dev liblcms2-dev \
            libxcursor-dev libxi-dev libevdev-dev libdisplay-info-dev libmujs-dev liblua5.2-dev \
            libsecret-1-dev libjsoncpp-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good desktop-file-utils file

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ matrix.channel }}
          cache: true

      - name: Fetch libmpv (mpv-build)
        run: python3 scripts/fetch_linux_libmpv.py --dest libmpv-prefix

      # The real server settings (the account server, the update addresses) are not in the
      # repository: they come from the SERVER_CONFIG secret (lib/data/server_config.dart in
      # base64). A build without them would have no accounts and could never be updated, so it
      # stops instead.
      - name: Write the server settings
        shell: bash
        env:
          SERVER_CONFIG: ${{ secrets.SERVER_CONFIG }}
        run: |
          if [ -z "$SERVER_CONFIG" ]; then
            echo "::error::No SERVER_CONFIG secret: this build would have no accounts and no updater."
            exit 1
          fi
          printf '%s' "$SERVER_CONFIG" | base64 -d > lib/data/server_config.dart
          grep -q updateListAddresses lib/data/server_config.dart
      - run: flutter pub get

      - name: Build
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/libmpv-prefix/lib/pkgconfig:${{ github.workspace }}/libmpv-prefix/lib/${{ matrix.triplet }}/pkgconfig
        run: flutter build linux --release

      # libmpv and everything it links travel with the app (upstream's packaging).
      - name: Bundle libmpv
        run: |
          B=build/linux/${{ matrix.arch }}/release/bundle
          LIBMPV_DIR=$(dirname "$(find libmpv-prefix -name 'libmpv.so' | head -1)")
          cp -a "$LIBMPV_DIR"/libmpv.so* "$B/lib/"
          cp -a libmpv-prefix/lib/libshaderc_shared.so* "$B/lib/" 2>/dev/null || true
          bash linux/packaging/bundle-libs.sh "$B"
          cp linux/packaging/vysetv.sh "$B/vysetv.sh"
          chmod +x "$B/vysetv.sh"

      # A library libmpv links that this machine does not have cannot be bundled,
      # and the app would then not start on a machine without it either.
      - name: Check the bundle's libraries resolve
        run: |
          B=build/linux/${{ matrix.arch }}/release/bundle
          missing=$(LD_LIBRARY_PATH="$B/lib" ldd "$B/vyse_tv" "$B"/lib/*.so* 2>/dev/null | grep "not found" | sort -u || true)
          if [ -n "$missing" ]; then
            echo "$missing"
            echo "::warning::Some libraries the bundle needs were not found on the build machine (listed above)."
          else
            echo "Every library resolves."
          fi

      # Say so in the log if the torrent engine did not make it into the bundle
      # (the app then fetches it the first time a torrent is played).
      - name: Check the torrent engine
        run: |
          if [ -s build/linux/${{ matrix.arch }}/release/bundle/lib/torrserver ]; then
            echo "Torrent engine bundled."
          else
            echo "::warning::The torrent engine is not in the bundle (see packages/torrserver_flutter/linux/CMakeLists.txt)."
          fi

      # The engine is installed without its executable bit. In the tarball the app
      # sets it on first use; an AppImage is read-only, so it is set here.
      - name: Make the torrent engine executable
        run: |
          if [ -f build/linux/${{ matrix.arch }}/release/bundle/lib/torrserver ]; then
            chmod 755 build/linux/${{ matrix.arch }}/release/bundle/lib/torrserver
          fi

      # One file with everything in it (upstream's packaging): the bundle above,
      # libmpv, the torrent engine and every library that can travel.
      # appimagetool and the runtime it embeds are pinned and checksummed.
      - name: Build the AppImage
        env:
          # no FUSE on the build machine: appimagetool unpacks itself instead of mounting
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          bash linux/packaging/fetch-appimage-tools.sh ${{ matrix.arch }} "$RUNNER_TEMP/appimage"
          VERSION=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml | head -1)
          export VERSION
          export APPIMAGETOOL="$RUNNER_TEMP/appimage/appimagetool"
          export RUNTIME_FILE="$RUNNER_TEMP/appimage/runtime"
          bash linux/packaging/build-appimage.sh build/linux/${{ matrix.arch }}/release/bundle ${{ matrix.arch }} "$GITHUB_WORKSPACE"

      # upload-artifact drops the executable bit, so the bundle travels as a tarball.
      - name: Pack the bundle
        run: tar -czf vysetv-linux-${{ matrix.arch }}.tar.gz -C build/linux/${{ matrix.arch }}/release/bundle .

      - uses: actions/upload-artifact@v4
        with:
          name: vysetv-linux-${{ matrix.arch }}
          path: vysetv-linux-${{ matrix.arch }}.tar.gz
          retention-days: 2 # a private repository has 500 MB for these

      # (After downloading: chmod +x the .AppImage, then run it.)
      - uses: actions/upload-artifact@v4
        with:
          name: vysetv-linux-${{ matrix.arch }}-appimage
          path: VyseTV-${{ matrix.appimage }}.AppImage
          retention-days: 2 # a private repository has 500 MB for these

  # macos-26-intel: GitHub's Apple-chip Macs (macos-26) were too short to start a job at all
  # (2026-11-19, cancelled twice after 15 minutes); the Intel ones carry the same macOS 26 and
  # Xcode 26, and an Intel Mac builds the universal app just the same.
  # macOS 26: the player uses APIs from the Xcode 26 SDK
  # (CALayer.preferredDynamicRange), the same runner upstream builds on.
  # One app that runs on both Intel and Apple silicon Macs (a universal build),
  # in a disk image you drag to Applications. It is not signed with an Apple
  # developer certificate: the first time, right-click the app and choose Open.
  macos:
    name: macOS (Intel + Apple silicon)
    needs: plan
    if: ${{ needs.plan.outputs.macos == 'true' }}
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-swift-package-manager
      # The pod bundles packages/torrserver_flutter/macos/bin/torrserver. Its own
      # install script makes that file too, but CocoaPods does not promise to run
      # it for a plugin, so it is made here first: the two builds in binaries/
      # joined into one that runs on Intel and Apple silicon Macs.
      - name: Prepare the torrent engine
        run: |
          B=packages/torrserver_flutter/binaries
          D=packages/torrserver_flutter/macos/bin
          if [ -f "$B/torrserver-darwin-arm64.tar.gz" ] && [ -f "$B/torrserver-darwin-amd64.tar.gz" ]; then
            mkdir -p "$D/parts"
            tar -xzf "$B/torrserver-darwin-arm64.tar.gz" -C "$D/parts"
            tar -xzf "$B/torrserver-darwin-amd64.tar.gz" -C "$D/parts"
            lipo -create "$D/parts/torrserver-darwin-arm64" "$D/parts/torrserver-darwin-amd64" -output "$D/torrserver"
            rm -rf "$D/parts"
            chmod 755 "$D/torrserver"
            codesign --force --sign - "$D/torrserver"
            lipo -info "$D/torrserver"
          else
            echo "::warning::No macOS engine archives in $B: the pod's own download is the fallback."
          fi
      # The Usenet engine: a program in the vyse_usenet pod's resources (one file for Intel and
      # Apple silicon), made runnable and signed ad hoc like the torrent engine
      - name: Prepare the Usenet engine
        run: |
          D=packages/vyse_usenet/macos/bin
          rm -rf "$D" && mkdir -p "$D"
          unzip -o -q packages/vyse_usenet/binaries/vyse-usenet-darwin-universal.zip -d "$D"
          chmod 755 "$D/vyse-usenet"
          codesign --force --sign - "$D/vyse-usenet"
          lipo -info "$D/vyse-usenet"
      # The real server settings (the account server, the update addresses) are not in the
      # repository: they come from the SERVER_CONFIG secret (lib/data/server_config.dart in
      # base64). A build without them would have no accounts and could never be updated, so it
      # stops instead.
      - name: Write the server settings
        shell: bash
        env:
          SERVER_CONFIG: ${{ secrets.SERVER_CONFIG }}
        run: |
          if [ -z "$SERVER_CONFIG" ]; then
            echo "::error::No SERVER_CONFIG secret: this build would have no accounts and no updater."
            exit 1
          fi
          printf '%s' "$SERVER_CONFIG" | base64 -d > lib/data/server_config.dart
          grep -q updateListAddresses lib/data/server_config.dart
      - run: flutter pub get
      # flutter build passes -skipPackageUpdates, so MPVKit has to be fetched first.
      - name: Resolve Swift packages (MPVKit)
        run: |
          flutter build macos --config-only --release
          xcodebuild -resolvePackageDependencies -workspace macos/Runner.xcworkspace -scheme Runner
      - run: flutter build macos --release
      - name: Check the torrent engine
        run: |
          E=$(find build/macos/Build/Products/Release/VyseTV.app -name torrserver -type f -size +1000k | head -1)
          if [ -n "$E" ]; then
            echo "Torrent engine bundled: $E"
            lipo -info "$E"
          else
            echo "::warning::The torrent engine is not inside the app (it would be fetched on first use)."
          fi
      # The app itself has to hold both kinds of code, or it only starts on one
      # kind of Mac. Anything inside it built for one kind only is listed.
      - name: Check it runs on Intel and Apple silicon
        run: |
          APP=build/macos/Build/Products/Release/VyseTV.app
          MAIN="$APP/Contents/MacOS/VyseTV"
          archs=$(lipo -archs "$MAIN")
          echo "VyseTV: $archs"
          case "$archs" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::error::The app is built for '$archs' only, not for both Intel and Apple silicon."; exit 1 ;; esac
          find "$APP/Contents" -type f \( -name '*.dylib' -o -perm +111 \) | while read -r f; do
            a=$(lipo -archs "$f" 2>/dev/null) || continue
            case "$a" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "::warning::Built for '$a' only: ${f#"$APP"/}" ;; esac
          done
      # upload-artifact breaks the symlinks and executable bits inside an .app,
      # so it travels inside a disk image (upstream's packaging).
      - name: Make the disk image
        run: |
          mkdir -p dmg-staging
          cp -R build/macos/Build/Products/Release/VyseTV.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -format ULMO -srcfolder dmg-staging -volname "VyseTV" VyseTV-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: vysetv-macos
          path: VyseTV-macos.dmg
          retention-days: 2 # a private repository has 500 MB for these

  # iPhone and iPad: an .ipa without a signature, to install with a sideloading
  # tool that signs it with your own Apple ID.
  ios:
    name: iOS (unsigned .ipa, for sideloading)
    needs: plan
    if: ${{ needs.plan.outputs.ios == 'true' }}
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-swift-package-manager
      # The engines: the Usenet engine and the torrent engine in ONE Go library (one Go runtime in
      # the app; packages/vyse_usenet/apple), linked into the app by the Usenet plugin's pod, which
      # the torrent plugin's pod depends on
      - name: Prepare the engines
        run: |
          rm -rf packages/vyse_usenet/ios/VyseUsenet-ios.xcframework
          unzip -q packages/vyse_usenet/binaries/vyse-usenet-ios-arm64.xcframework.zip -d packages/vyse_usenet/ios/
          plutil -p packages/vyse_usenet/ios/VyseUsenet-ios.xcframework/Info.plist | grep -E 'LibraryIdentifier|SupportedPlatform'
          nm -gU packages/vyse_usenet/ios/VyseUsenet-ios.xcframework/ios-arm64/libvyse_usenet.a 2>/dev/null | grep -E ' T _(TorrServer|VyseUsenet)Start$' | sort -u
      # The real server settings (the account server, the update addresses) are not in the
      # repository: they come from the SERVER_CONFIG secret (lib/data/server_config.dart in
      # base64). A build without them would have no accounts and could never be updated, so it
      # stops instead.
      - name: Write the server settings
        shell: bash
        env:
          SERVER_CONFIG: ${{ secrets.SERVER_CONFIG }}
        run: |
          if [ -z "$SERVER_CONFIG" ]; then
            echo "::error::No SERVER_CONFIG secret: this build would have no accounts and no updater."
            exit 1
          fi
          printf '%s' "$SERVER_CONFIG" | base64 -d > lib/data/server_config.dart
          grep -q updateListAddresses lib/data/server_config.dart
      - run: flutter pub get
      - name: Resolve Swift packages (MPVKit)
        run: |
          flutter build ios --config-only --release --no-codesign
          xcodebuild -resolvePackageDependencies -workspace ios/Runner.xcworkspace -scheme Runner
      - run: flutter build ios --release --no-codesign
      # One Go runtime in the whole app, holding both engines (two crashed 1.0.4 at launch)
      - name: Check the engines
        run: bash packages/vyse_usenet/tool/one_go_runtime.sh build/ios/iphoneos/Runner.app
      - name: Package an unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry VyseTV-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: vysetv-ios-unsigned
          path: VyseTV-unsigned.ipa
          retention-days: 2 # a private repository has 500 MB for these

  android:
    name: Android
    needs: plan
    if: ${{ needs.plan.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The real server settings (the account server, the update addresses) are not in the
      # repository: they come from the SERVER_CONFIG secret (lib/data/server_config.dart in
      # base64). A build without them would have no accounts and could never be updated, so it
      # stops instead.
      - name: Write the server settings
        shell: bash
        env:
          SERVER_CONFIG: ${{ secrets.SERVER_CONFIG }}
        run: |
          if [ -z "$SERVER_CONFIG" ]; then
            echo "::error::No SERVER_CONFIG secret: this build would have no accounts and no updater."
            exit 1
          fi
          printf '%s' "$SERVER_CONFIG" | base64 -d > lib/data/server_config.dart
          grep -q updateListAddresses lib/data/server_config.dart
      - run: flutter pub get
      - run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: vysetv-android
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 2 # a private repository has 500 MB for these

  windows:
    name: Windows (x64)
    needs: plan
    if: ${{ needs.plan.outputs.windows == 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The DirectComposition engine: without it the video stays hidden
      # behind the UI (the CMake install step refuses a stock engine).
      - name: Install the patched Windows engine (flutter-plezy)
        shell: pwsh
        run: |
          flutter precache --windows
          ./windows/tool/install-patched-engine.ps1
      # The real server settings (the account server, the update addresses) are not in the
      # repository: they come from the SERVER_CONFIG secret (lib/data/server_config.dart in
      # base64). A build without them would have no accounts and could never be updated, so it
      # stops instead.
      - name: Write the server settings
        shell: bash
        env:
          SERVER_CONFIG: ${{ secrets.SERVER_CONFIG }}
        run: |
          if [ -z "$SERVER_CONFIG" ]; then
            echo "::error::No SERVER_CONFIG secret: this build would have no accounts and no updater."
            exit 1
          fi
          printf '%s' "$SERVER_CONFIG" | base64 -d > lib/data/server_config.dart
          grep -q updateListAddresses lib/data/server_config.dart
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: vysetv-windows-x64
          path: build/windows/x64/runner/Release
          retention-days: 2 # a private repository has 500 MB for these

  # LG webOS: the TV package (.ipk). Not run on a TV yet (webos/README.md), so it is built only
  # when asked for by name, [webos], and is not part of [all].
  #
  # It is built with LG's own Flutter SDK, not the pinned Flutter above. LG's NDK comes under
  # the "LG SDK License Agreement", which only the repository's owner can accept: the job runs
  # once the repository variable LG_NDK_LICENSE is set to "accepted" (Settings > Secrets and
  # variables > Actions > Variables), and says so when it is not.
  webos:
    name: LG webOS
    needs: plan
    if: ${{ needs.plan.outputs.webos == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: LG's NDK licence
        env:
          LG_NDK_LICENSE: ${{ vars.LG_NDK_LICENSE }}
        run: |
          if [ "$LG_NDK_LICENSE" != "accepted" ]; then
            echo "::error::LG's webOS NDK is under the LG SDK License Agreement. Read it (github.com/lg-flutter-webos/ndk), and if you accept it set the repository variable LG_NDK_LICENSE to: accepted"
            exit 1
          fi
      # The real server settings (the account server, the update addresses) are not in the
      # repository: they come from the SERVER_CONFIG secret (lib/data/server_config.dart in
      # base64). A build without them would have no accounts and could never be updated, so it
      # stops instead.
      - name: Write the server settings
        shell: bash
        env:
          SERVER_CONFIG: ${{ secrets.SERVER_CONFIG }}
        run: |
          if [ -z "$SERVER_CONFIG" ]; then
            echo "::error::No SERVER_CONFIG secret: this build would have no accounts and no updater."
            exit 1
          fi
          printf '%s' "$SERVER_CONFIG" | base64 -d > lib/data/server_config.dart
          grep -q updateListAddresses lib/data/server_config.dart
      # (the party's voice on an LG TV is Go: packages/vyse_webos/voice)
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/vyse_webos/voice/go.mod
          cache: false
      - name: LG's Flutter SDK, webOS CLI and NDK
        run: bash tool/webos/setup.sh --accept-lg-ndk-license
      - name: Build
        run: bash tool/webos/build.sh
      # The webOS Homebrew project's checker (github.com/webosbrew/dev-toolbox-cli, as
      # moonlight-tv runs it): whether a TV would install each package at all (a fault there
      # fails the job), and every library in it against the libraries and symbols of real LG
      # firmware (its data: webOS 1 to 25). Those rows read FAIL for both packages and that is
      # expected (first run, 2026-11-28): the older-webOS package starts on a runtime of its own
      # (glibc 2.41, the C++ library), which the checker does not see, and the webOS 26 package
      # needs LG's Flutter libraries, which only webOS 26 has and the data does not. So the
      # report is only for reading (the job summary, and *.firmware-check.txt in the artifact):
      # a row that changes from one build to the next is the thing to look at.
      - name: Check the packages against LG firmware
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          ls build/webos/*.ipk >/dev/null 2>&1 || { echo "No package to check."; exit 0; }
          TAG=v20261017-2d5a7b6
          VER=0.10.0-1
          mkdir -p /tmp/toolbox
          for p in ipk-verify fw-symbols; do
            curl -sfL -o "/tmp/toolbox/$p.deb" "https://github.com/webosbrew/dev-toolbox-cli/releases/download/$TAG/webosbrew-toolbox-${p}_${VER}_amd64.deb" || { echo "::warning::The firmware checker could not be downloaded ($p)."; exit 0; }
          done
          sudo apt-get install -yq /tmp/toolbox/*.deb >/dev/null || { echo "::warning::The firmware checker would not install."; exit 0; }
          worst=0
          for ipk in build/webos/*.ipk; do
            echo "## $(basename "$ipk")" >> "$GITHUB_STEP_SUMMARY"
            webosbrew-ipk-verify -f markdown -d -o /tmp/report.md "$ipk"
            code=$?
            cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
            webosbrew-ipk-verify -f plain "$ipk" > "build/webos/$(basename "$ipk" .ipk).firmware-check.txt" 2>&1
            case $code in
              0) echo "$(basename "$ipk"): compatible with every firmware checked" ;;
              1) echo "$(basename "$ipk"): libraries the firmware data does not have (expected, see above)" ;;
              6) echo "::error::$(basename "$ipk"): built in a way no TV will install"; worst=6 ;;
              *) echo "::warning::$(basename "$ipk"): the checker could not check it (exit $code)" ;;
            esac
          done
          # (a package no TV installs is a broken build; anything else is for reading)
          [ "$worst" = 6 ] && exit 1
          exit 0
      # (also when the look inside the package found something missing: the package is then
      # what there is to look at)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: vysetv-webos
          path: |
            build/webos/*.ipk
            build/webos/*.firmware-check.txt
          if-no-files-found: ignore
          retention-days: 2 # a private repository has 500 MB for these

  # Apple TV: an .ipa without a signature, put on an Apple TV with a sideloading tool that signs
  # it with your own Apple ID (tvos/README.md). Not run on an Apple TV yet, so it is built only
  # when asked for by name, [tvos], and is not part of [all].
  #
  # Flutter's tool has no Apple TV target: the app is built by Xcode from tvos/Runner.xcodeproj,
  # on a Flutter engine made for tvOS (tvos/engine.version), and the Dart by that engine's own
  # compiler (tvos/scripts/xcode_appletv.sh). On an Intel Mac, as the iPhone job: no Apple silicon
  # Mac (macos-26, macos-15) has ever taken a job of this repository. The engine's own tools are
  # Apple silicon only, so there the Dart is compiled with Flutter's own runtime, front end and
  # iPhone gen_snapshot of the same Dart version (the script checks that it is the same).
  tvos:
    name: Apple TV (unsigned .ipa, for sideloading)
    needs: plan
    if: ${{ needs.plan.outputs.tvos == 'true' }}
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # The real server settings (the account server, the update addresses) are not in the
      # repository: they come from the SERVER_CONFIG secret (lib/data/server_config.dart in
      # base64). A build without them would have no accounts, so it stops instead.
      - name: Write the server settings
        shell: bash
        env:
          SERVER_CONFIG: ${{ secrets.SERVER_CONFIG }}
        run: |
          if [ -z "$SERVER_CONFIG" ]; then
            echo "::error::No SERVER_CONFIG secret: this build would have no accounts."
            exit 1
          fi
          printf '%s' "$SERVER_CONFIG" | base64 -d > lib/data/server_config.dart
          grep -q updateListAddresses lib/data/server_config.dart
      - run: flutter pub get
      # The project and the plugin copies in it are made by scripts; what is committed must be
      # what they make from this checkout, or the app would build with stale pieces.
      - name: Check the project and its plugin copies are current
        run: |
          python3 tool/tvos/vendor_plugins.py --check
          python3 tool/tvos/make_project.py
          git diff --exit-code -- tvos/ || { echo "::error::tvos/ is not what tool/tvos/make_project.py makes: run it and commit the result."; exit 1; }
      # The engines: the Usenet engine and the torrent engine in ONE Go library linked into the app
      # (one Go runtime: two in the app's program crashed 1.0.4 at launch; packages/vyse_usenet/apple)
      - name: Unpack the engines
        run: |
          rm -rf tvos/Frameworks && mkdir -p tvos/Frameworks
          unzip -q packages/vyse_usenet/binaries/vyse-usenet-tvos-arm64.xcframework.zip -d tvos/Frameworks
          plutil -p tvos/Frameworks/VyseUsenet-tvos.xcframework/Info.plist | grep -E 'LibraryIdentifier|SupportedPlatform'
          nm -gU tvos/Frameworks/VyseUsenet-tvos.xcframework/tvos-arm64/libvyse_usenet.a 2>/dev/null | grep -E ' T _(TorrServer|VyseUsenet)Start$' | sort -u
      # A party's voice call: the WebRTC build flutter_webrtc pins, its Apple TV slices (tvOS 17)
      - name: Fetch WebRTC for tvOS
        run: bash tvos/scripts/fetch_webrtc.sh
      - name: Fetch the Flutter engine for tvOS
        run: |
          # (Flutter's own iPhone tools: the Dart compiler for the TV where the engine's cannot run)
          flutter precache --ios
          bash tvos/scripts/fetch_engine.sh
          echo "Dart: engine $(cat "$HOME/.cache/flutter-tvos-engine/v$(cat tvos/engine.version)/out/host_release/dart-sdk/version" 2>/dev/null), Flutter $(cat "$FLUTTER_ROOT/bin/cache/dart-sdk/version")"
          echo "Flutter's engine: $(cat "$FLUTTER_ROOT/bin/cache/engine.stamp" 2>/dev/null || cat "$FLUTTER_ROOT/bin/internal/engine.version")"
          lipo -archs "$FLUTTER_ROOT/bin/cache/artifacts/engine/ios-release/gen_snapshot_arm64" || true
          # (which of the engine's tools this Mac can run: the Dart compiler for the TV must be one)
          ENGINE="$(sed -n 's/^FLUTTER_LOCAL_ENGINE=//p' tvos/Flutter/Generated.xcconfig)"
          echo "this Mac: $(uname -m)"
          find "$ENGINE/out" -maxdepth 3 \( -name 'gen_snapshot*' -o -name dartaotruntime \) -type f | while read -r f; do
            echo "  ${f#"$ENGINE/out/"}: $(lipo -archs "$f" 2>/dev/null || echo '?')"
          done
      - name: Resolve Swift packages (MPVKit)
        run: xcodebuild -resolvePackageDependencies -workspace tvos/Runner.xcworkspace -scheme Runner
      # Xcode says a great deal; the whole of it is kept as a file of the run, and what matters
      # (the Dart build's own lines, errors, warnings of our Swift) is shown here.
      - name: Build for Apple TV
        run: |
          mkdir -p build
          set +e
          xcodebuild -workspace tvos/Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk appletvos -destination 'generic/platform=tvOS' -derivedDataPath build/tvos-derived \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > build/tvos-build.log 2>&1
          status=$?
          set -e
          grep -E '└─|error:|ERROR|warning: .*(tvos/|MpvPlayer/|torrserver)' build/tvos-build.log | head -n 300 || true
          if [ "$status" != 0 ]; then
            echo "::error::xcodebuild failed ($status); the last of its output:"
            tail -n 150 build/tvos-build.log
            exit "$status"
          fi
      - name: Look inside the app
        run: |
          APP=build/tvos-derived/Build/Products/Release-appletvos/Runner.app
          ls -la "$APP" "$APP/Frameworks"
          for f in App Flutter; do
            B="$APP/Frameworks/$f.framework/$f"
            [ -f "$B" ] || { echo "::error::$f.framework is not in the app"; exit 1; }
            echo "$f.framework: $(stat -f%z "$B") bytes, $(lipo -archs "$B")"
          done
          [ "$(stat -f%z "$APP/Frameworks/App.framework/App")" -gt 5000000 ] || { echo "::error::App.framework is too small to hold the app's Dart"; exit 1; }
          # (the torrent engine is linked into the app's own program: tens of megabytes of it)
          echo "Runner: $(stat -f%z "$APP/Runner") bytes"
          [ "$(stat -f%z "$APP/Runner")" -gt 30000000 ] && echo "torrent engine linked in" || { echo "::error::the app's program is too small to hold the torrent engine"; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :MinimumOSVersion' -c 'Print :DTPlatformName' "$APP/Info.plist"
          otool -L "$APP/Runner" | head -n 30
          # one Go runtime in the whole app, holding both engines
          bash packages/vyse_usenet/tool/one_go_runtime.sh "$APP"
      - name: Package an unsigned .ipa
        run: |
          rm -rf Payload && mkdir -p Payload
          cp -R build/tvos-derived/Build/Products/Release-appletvos/Runner.app Payload/
          zip -qry VyseTV-tvOS-unsigned.ipa Payload
          ls -la VyseTV-tvOS-unsigned.ipa
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: vysetv-tvos-unsigned
          path: |
            VyseTV-tvOS-unsigned.ipa
            build/tvos-build.log
          if-no-files-found: ignore
          retention-days: 2 # a private repository has 500 MB for these

  # The torrent engine for Apple TV: TorrServer linked into the app as TorrServerKit.xcframework
  # (packages/torrserver_flutter/tool/go-shim/build-tvos-xcframework.sh). Built on its own, by
  # name ([tvos-torrent]); the .zip it makes is committed to packages/torrserver_flutter/binaries,
  # where the tvos job takes it from.
  tvos-torrent:
    name: Apple TV torrent engine (TorrServerKit.xcframework)
    needs: plan
    if: ${{ needs.plan.outputs.tvos_torrent == 'true' }}
    runs-on: macos-26-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: bash packages/torrserver_flutter/tool/go-shim/build-tvos-xcframework.sh
        env:
          OUTPUT_DIR: ${{ github.workspace }}/dist
      - uses: actions/upload-artifact@v4
        with:
          name: torrserverkit-tvos
          path: dist/TorrServerKit-tvos.xcframework.zip
          retention-days: 2

  # Samsung TVs (Tizen): .tpk packages, one for each Tizen version Samsung's player plugin is
  # made for (tizen/README.md). Not run on a TV yet, so built only when asked for by name,
  # [tizen], and not part of [all].
  #
  # Built with flutter-tizen at the release made from this project's own Flutter, as
  # flutter-tizen's own plugins are built on GitHub. The Tizen SDK comes under the Tizen SDK
  # licence, which only the repository's owner can accept: the job runs once the repository
  # variable TIZEN_SDK_LICENSE is set to "accepted", and says so when it is not.
  tizen:
    name: Samsung TV (Tizen)
    needs: plan
    if: ${{ needs.plan.outputs.tizen == 'true' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: The Tizen SDK licence
        env:
          TIZEN_SDK_LICENSE: ${{ vars.TIZEN_SDK_LICENSE }}
        run: |
          if [ "$TIZEN_SDK_LICENSE" != "accepted" ]; then
            echo "::error::The Tizen SDK is under the Tizen SDK licence. Read it (developer.tizen.org), and if you accept it set the repository variable TIZEN_SDK_LICENSE to: accepted"
            exit 1
          fi
      # The real server settings (the account server, the update addresses) are not in the
      # repository: they come from the SERVER_CONFIG secret (lib/data/server_config.dart in
      # base64). A build without them would have no accounts, so it stops instead.
      - name: Write the server settings
        shell: bash
        env:
          SERVER_CONFIG: ${{ secrets.SERVER_CONFIG }}
        run: |
          if [ -z "$SERVER_CONFIG" ]; then
            echo "::error::No SERVER_CONFIG secret: this build would have no accounts."
            exit 1
          fi
          printf '%s' "$SERVER_CONFIG" | base64 -d > lib/data/server_config.dart
          grep -q updateListAddresses lib/data/server_config.dart
      # (the app's Tizen side is C#: a Samsung TV takes no C++ app)
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # (the torrent engine is Go, and TorrServer's web page is made with Node as it is fetched:
      # tool/tizen/native.sh)
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: The Tizen SDK's tools, and flutter-tizen
        run: bash tool/tizen/setup.sh --accept-tizen-sdk-license
      - name: Build (the TV's own libraries, then Tizen 6.0, 6.5 and 10.0)
        run: bash tool/tizen/build.sh
      # (also when the look inside a package found something missing: the packages are then
      # what there is to look at)
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: vysetv-tizen
          path: build/tizen/*.tpk
          if-no-files-found: ignore
          retention-days: 2 # a private repository has 500 MB for these
